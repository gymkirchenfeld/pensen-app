name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Muss vor setup-node laufen: `cache: yarn` ruft intern
      # `yarn config get cacheFolder` auf und braucht Yarn bereits.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --immutable

      - run: yarn lint --no-fix

      - run: yarn build