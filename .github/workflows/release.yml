name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Muss vor setup-node laufen: `cache: yarn` ruft intern
      # `yarn config get cacheFolder` auf und braucht Yarn bereits.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --immutable

      - name: Version gegen Tag prüfen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(sed -n "s/.*VERSION = '\(.*\)'.*/\1/p" src/version.js)
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG passt nicht zu src/version.js ($VERSION)"
            exit 1
          fi

      - run: yarn build

      - name: Artefakte packen
        working-directory: dist
        run: |
          zip -r "../pensen-app-${GITHUB_REF_NAME}.zip" .
          tar -czf "../pensen-app-${GITHUB_REF_NAME}.tar.gz" .

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            "pensen-app-${GITHUB_REF_NAME}.zip" \
            "pensen-app-${GITHUB_REF_NAME}.tar.gz"